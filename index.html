<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pawinner — Portfolio of Works</title>
  <meta name="description" content="Portfolio of Pawinner: web apps, event tools, and IT_SMCU projects organized by event." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&family=JetBrains+Mono:wght@400;500&family=Urbanist:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ═══ HERO HEADER ═══ -->
  <header class="site-header">
    <div class="header-bg-blobs">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
    <div class="header-content">
      <div class="avatar-wrap">
        <img
          src="https://avatars.githubusercontent.com/u/88769511?v=4"
          alt="Pawinner avatar"
          class="avatar"
          width="90"
          height="90"
        />
        <span class="avatar-ring"></span>
      </div>
      <div class="header-text">
        <h1 class="hero-name">Pawinner</h1>
        <p class="hero-sub">A 2nd year medical student that can vibecode.<br><span class="hero-accent">No AI, No me.</span></p>
        <div class="header-actions">
          <a href="https://github.com/pawinner" target="_blank" rel="noopener noreferrer" class="btn btn-gh">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
            @pawinner
          </a>
          <button id="themeToggle" class="btn btn-icon" type="button" aria-label="Toggle theme">
            <span id="themeIcon">☀️</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Search bar in header -->
    <div class="header-search">
      <div class="search-wrap">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input
          id="searchInput"
          type="search"
          placeholder="Search projects, tech, roles…"
          aria-label="Search projects"
        />
      </div>
    </div>
  </header>

  <!-- ═══ LAYOUT: sidebar + (main + footer) ═══ -->
  <div class="layout">

    <!-- Left sidebar nav -->
    <aside class="sidebar" id="sidebar">
      <nav class="side-nav" id="sideNav" aria-label="Event navigation">
        <p class="side-nav-label">Events</p>
        <!-- filled by JS -->
      </nav>
    </aside>

    <!-- Right column: content + footer together so sidebar sticky spans both -->
    <div class="main-wrapper">
      <main class="main-content">
        <div class="stats-bar" id="statsBar"></div>
        <div id="portfolioRoot" class="events-list"></div>
      </main>

      <footer class="site-footer">
        <div class="footer-inner">
          <span>Built for <a href="https://github.com/pawinner/pawinner.github.io" target="_blank" rel="noopener noreferrer">pawinner.github.io</a></span>
          <span>Organized by event folders &amp; GitHub repositories</span>
        </div>
      </footer>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
